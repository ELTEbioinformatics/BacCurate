[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baccurate"
version = "0.5.2"
description = "Python metadata harmonizer for BioSample ESKAPEE data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Norbert Kada", email = "kada.norbert@gmail.com" },
]

dependencies = [
    "instructor~=1.15.4",
    "openai~=2.53.0",
    "pydantic~=2.11",
    "pandas~=2.2.3",
    "lxml~=6.0",
    "plotly~=6.9.0",
    "numpy~=2.5.1",
    "python-dotenv~=1.2.2",
    "country_converter~=1.3.1",
    "PyYAML~=6.0.2",
    "reverse-geocode~=1.6.6",
    "tqdm~=4.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.urls]
Repository = "https://github.com/ELTEbioinformatics/BacCurate.git"
Issues = "https://github.com/ELTEbioinformatics/BacCurate/issues"

[project.scripts]
baccurate = "baccurate.run.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["baccurate*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
minversion = "8.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax)
    "B",      # bugbear (common bug patterns)
    "SIM",    # simplify (code simplification suggestions)
    "RUF",    # ruff-specific rules
    "TID",    # tidy imports (package boundaries)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"baccurate.extraction.bioproject".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.cli".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.curation".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.io".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.manual_review".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.metadata_types".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.tables".msg = "import from baccurate.extraction, not its submodules"
"baccurate.extraction.xml".msg = "import from baccurate.extraction, not its submodules"
"baccurate.standardization._attribute_value_text".msg = "package-private"
"baccurate.standardization._cache".msg = "package-private"
"baccurate.standardization._collection_date_interpreter".msg = "package-private"
"baccurate.standardization._isolation_source_ontology_renderer".msg = "package-private"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501", "E702", "B905", "B023"]
"src/baccurate/extraction/*" = ["TID251"]
"src/baccurate/standardization/*" = ["TID251"]
"tests/standardization/*" = ["TID251"]
