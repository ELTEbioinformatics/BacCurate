schema_version: 1
vocabulary_version: "2.2.0"
retired_term_ids:
  - BACC:0000005
  - BACC:0000006

facets:
  source_type:
    cardinality: single
    output_column: iso_source_type
    render_order: 1
    standards_bindings:
      mixs:
        - package/checklist choice
      pha4ge_geneepio: []
      external_ontology_namespaces:
        - ENVO
        - FOODON
    meaning: The one broad kind of source the isolate came from.
    classifier_guidance: >-
      Set this facet only when every facet except facility is empty. If the metadata names only a host,
      use `host-associated`. Use `laboratory` only when laboratory wording is the sole informative
      content. Example: `blood culture` and `urine culture` name specimens instead.

  body_product:
    cardinality: multiple
    output_column: iso_body_product
    render_order: 2
    standards_bindings:
      mixs:
        - host_body_product
      pha4ge_geneepio:
        - body product
      external_ontology_namespaces:
        - UBERON
    meaning: The body substance sampled from a host.
    classifier_guidance: >-
      Use this facet only for substances. Use `body_site` for an organ or anatomical region.

  body_site:
    cardinality: multiple
    output_column: iso_body_site
    render_order: 3
    standards_bindings:
      mixs:
        - host_body_site
      pha4ge_geneepio:
        - anatomical part
      external_ontology_namespaces:
        - UBERON
        - NCIT
    meaning: The anatomical location the sample came from.
    classifier_guidance: >-
      Set this facet only when the metadata names the anatomical location. Do not infer a location
      from a substance alone.

  lesion:
    cardinality: multiple
    output_column: iso_lesion
    render_order: 4
    standards_bindings:
      mixs:
        - host_disease_stat (loosely)
      pha4ge_geneepio:
        - host disease
      external_ontology_namespaces:
        - MONDO
    meaning: The pathological structure sampled.
    classifier_guidance: >-
      Use this facet for the pathological structure that was sampled, not the host's diagnosis. Example: set
      it for `wound swab`, but not for `patient with pneumonia`.

  environmental_material:
    cardinality: multiple
    output_column: iso_environmental_material
    render_order: 5
    standards_bindings:
      mixs:
        - env_medium
      pha4ge_geneepio:
        - environmental material
      external_ontology_namespaces:
        - ENVO
    meaning: The non-host material sampled.
    classifier_guidance: Use the non-host material that was sampled, not its location.

  facility:
    cardinality: multiple
    output_column: iso_facility
    render_order: 6
    standards_bindings:
      mixs:
        - env_local_scale (part)
      pha4ge_geneepio:
        - environmental site
      external_ontology_namespaces:
        - ENVO
    meaning: The kind of built facility where the sample was collected.
    classifier_guidance: >-
      Set this facet for the collection setting, whether a host or the built environment was
      sampled there. It states where the isolate was collected, never what was sampled. Use
      `environmental_material` or `sampled_object` for a sampled material, object, or surface.
  sampled_object:
    cardinality: multiple
    output_column: iso_sampled_object
    render_order: 7
    standards_bindings:
      mixs:
        - env_local_scale (part)
      pha4ge_geneepio:
        - environmental site
        - collection device
      external_ontology_namespaces:
        - ENVO
        - OBI
    meaning: The object or surface of a built environment that was sampled.
    classifier_guidance: >-
      Set this facet when the object itself was sampled, which is how a sampled built environment
      is recorded. A swab used to collect material from a patient describes the collection method,
      not a sampled object.

  food_type:
    cardinality: multiple
    output_column: iso_food_type
    render_order: 8
    standards_bindings:
      mixs:
        - food package food_product_type
      pha4ge_geneepio: []
      external_ontology_namespaces:
        - FOODON
    meaning: The food or feed sampled.
    classifier_guidance: Use the sampled food or feed, including feed given to a host.
