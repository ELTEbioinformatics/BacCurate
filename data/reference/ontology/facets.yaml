schema_version: 1
vocabulary_version: "1.0.0rc1"

facets:
  source_type:
    standards_bindings:
      mixs:
        - package/checklist choice
      pha4ge_geneepio: []
      external_ontology_namespaces:
        - ENVO
        - FOODON
    meaning: The broad kinds of source the isolate came from.

  body_product:
    standards_bindings:
      mixs:
        - host_body_product
      pha4ge_geneepio:
        - body product
      external_ontology_namespaces:
        - UBERON
    meaning: The body substance sampled from a host.

  body_site:
    standards_bindings:
      mixs:
        - host_body_site
      pha4ge_geneepio:
        - anatomical part
      external_ontology_namespaces:
        - UBERON
        - NCIT
    meaning: The anatomical location the sample came from.

  lesion:
    standards_bindings:
      mixs: []
      pha4ge_geneepio: []
      external_ontology_namespaces:
        - MONDO
    meaning: The pathological structure sampled.

  environmental_material:
    standards_bindings:
      mixs:
        - env_medium
      pha4ge_geneepio:
        - environmental material
      external_ontology_namespaces:
        - ENVO
    meaning: The non-host material sampled.

  facility:
    standards_bindings:
      mixs:
        - env_local_scale (part)
      pha4ge_geneepio:
        - environmental site
      external_ontology_namespaces:
        - ENVO
    meaning: The kind of built facility where the sample was collected.
  sampled_object:
    standards_bindings:
      mixs:
        - env_local_scale (part)
      pha4ge_geneepio:
        - environmental site
        - collection device
      external_ontology_namespaces:
        - ENVO
        - OBI
    meaning: The object or surface of a built environment that was sampled.

  food_type:
    standards_bindings:
      mixs:
        - food package food_product_type
      pha4ge_geneepio: []
      external_ontology_namespaces:
        - FOODON
    meaning: The food or feed sampled.

  host_disease:
    standards_bindings:
      mixs:
        - host_disease_stat
      pha4ge_geneepio:
        - host disease
      external_ontology_namespaces:
        - MONDO
    meaning: The diagnosis or the health state of the host.
