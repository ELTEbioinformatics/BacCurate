schema_version: 1
vocabulary_version: fixture-v2
retired_term_ids: []
facets:
  source_type:
    cardinality: single
    output_column: iso_source_type
    render_order: 1
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: []}
    meaning: The one broad kind of source the isolate came from.
    classifier_guidance: Set this facet only when every facet except facility is empty. Use laboratory only when laboratory wording is the sole informative content.
  body_product:
    cardinality: multiple
    output_column: iso_body_product
    render_order: 2
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [UBERON]}
    meaning: The body substance sampled from a host.
    classifier_guidance: Use this facet only for substances. Use body_site for an organ or anatomical region.
  body_site:
    cardinality: multiple
    output_column: iso_body_site
    render_order: 3
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [UBERON]}
    meaning: The anatomical location the sample came from.
    classifier_guidance: Set this facet only when the metadata names the anatomical location.
  lesion:
    cardinality: multiple
    output_column: iso_lesion
    render_order: 4
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: []}
    meaning: The pathological structure sampled.
    classifier_guidance: Use this facet for the sampled structure, not the host diagnosis.
  environmental_material:
    cardinality: multiple
    output_column: iso_environmental_material
    render_order: 5
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [ENVO]}
    meaning: The non-host material sampled.
    classifier_guidance: Use the material that was sampled, not its location.
  facility:
    cardinality: multiple
    output_column: iso_facility
    render_order: 6
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [ENVO]}
    meaning: The kind of built facility where the sample was collected.
    classifier_guidance: Set this facet for the collection setting, never for what was sampled.
  sampled_object:
    cardinality: multiple
    output_column: iso_sampled_object
    render_order: 7
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [ENVO]}
    meaning: The object or surface that was swabbed.
    classifier_guidance: Set this facet when the object itself was sampled, not for the collection device.
  food_type:
    cardinality: multiple
    output_column: iso_food_type
    render_order: 8
    standards_bindings: {mixs: [], pha4ge_geneepio: [], external_ontology_namespaces: [FOODON]}
    meaning: The food or feed sampled.
    classifier_guidance: Use the sampled food or feed.
