schema_version: 3
prompt_version: "18"

facets:
  source_type:
    output_column: iso_source_type
    render_order: 1
    classifier_guidance: >-
      Preserve every independently supported source type. If the metadata names only a host, use
      `host-associated`. A host name alone does not support `food or feed`. Use `laboratory strain`
      only for a strain that a laboratory kept, evolved, or engineered, not for the culture of a
      specimen.
  body_product:
    output_column: iso_body_product
    render_order: 2
    classifier_guidance: >-
      Use this facet only for substances. Use `body_site` for an organ or anatomical region.
  body_site:
    output_column: iso_body_site
    render_order: 3
    classifier_guidance: >-
      Set this facet only when the metadata names the anatomical location, or names an infection of
      one organ as output rule 8 describes. A body region inside a lesion name, such as the hand in
      "hand abscess", also sets `body_site`. A lesion that names no region sets none. Do not infer a
      location from a substance alone.
  lesion:
    output_column: iso_lesion
    render_order: 4
    classifier_guidance: >-
      Use this facet for the pathological structure that was sampled. The host's diagnosis goes to
      `host_disease`. Example: set it for `wound swab`, but not for `patient with pneumonia`.
  environmental_material:
    output_column: iso_environmental_material
    render_order: 5
    classifier_guidance: Use the non-host material that was sampled, not its location.
  facility:
    output_column: iso_facility
    render_order: 6
    classifier_guidance: >-
      Set this facet for the collection setting, whether a host or the built environment was sampled
      there. It states where the isolate was collected, never what was sampled. Use
      `environmental_material` or `sampled_object` for a sampled material, object, or surface.
  sampled_object:
    output_column: iso_sampled_object
    render_order: 7
    classifier_guidance: >-
      Set this facet when the object itself was sampled, which is how a sampled built environment is
      recorded. A swab or a catheter that collects a specimen from a patient describes the
      collection method, not a sampled object. Example: `urine from catheter` gives only `urine`.
  food_type:
    output_column: iso_food_type
    render_order: 8
    classifier_guidance: Use the sampled food or feed, including feed given to a host.
  host_disease:
    output_column: iso_host_disease
    render_order: 9
    classifier_guidance: >-
      Set this facet for a diagnosis or a health state of the host that any attribute names, also
      when a specimen is named or rule 8 sets a body site from the diagnosis. A patient, a clinical
      sample, a hospital, a transplant, a treatment, or a sampled lesion such as `wound swab` names
      no diagnosis. Carriage, a screening sample, and a healthy host give `colonization`. Treat an
      infection as bacterial unless the metadata names another cause. A disease with no label of its
      own, such as cancer or COVID-19, gives `disease`.

