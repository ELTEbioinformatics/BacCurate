# Values to assign the "laboratory strain" label to, based
# on the `ncbi_organism` field or `strain` attribute.
#
# Notes:
# - Species must match because strain names overlap (e.g., "Escherichia coli PA14").
# - Matches are case-insensitive whole tokens.
# - Hyphens, underscores, and spaces are interchangeable (e.g., "K-12" matches "K12").
laboratory_strain_names:
  Escherichia coli:
    - K-12
    - MG1655
    - W3110
    - BW25113
    - MC4100
    - DH1
